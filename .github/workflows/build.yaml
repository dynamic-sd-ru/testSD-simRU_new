# Сборка игры и публикация на GitHub Pages
name: Build and deploy to Pages

on:
  # сборка на каждый пуш в основную ветку
  push:
    branches: ["main"]

  # проверка сборки в pull request (без публикации)
  pull_request:
    branches: ["main"]

  # и вручную из вкладки Actions
  workflow_dispatch:

# права токена: чтение репозитория + публикация Pages
permissions:
  contents: read
  pages: write
  id-token: write

# одновременно выполняется только одна публикация
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # core.js собирается браузерифаем и на больших сценах требует памяти
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # dendrynexus подключается как git-зависимость; в package-lock.json
      # записаны только https-ссылки, поэтому ssh-ключи не нужны
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # compile проверяет сцены; скрипт также патчит строки движка
      # («Продолжить», «Игра окончена») и проверяет html-обвязку
      - name: Compile game
        run: npm run build

      # make-html не перезаписывает переведённый out/html/index.html:
      # в шаблоне движка он помечен префиксом «+» (копируется только если файла нет)
      - name: Build playable HTML
        run: npm run make-html

      - name: Copy game.json next to the HTML
        run: cp out/game.json out/html/game.json

      # сквозной смок-тест: партия от главного меню до концовки в jsdom.
      # Ловит блокирующие дефекты вроде неработающей кнопки «Продолжить».
      - name: Smoke test (playthrough to the ending)
        env:
          # на раннере анимации и перерисовка идут медленнее
          SMOKE_SLOW: "1"
        run: |
          python3 -m http.server 8099 --directory out/html --bind 127.0.0.1 &
          sleep 3
          node tools/smoke_play.js http://127.0.0.1:8099/index.html 2500 3

      - name: Upload artifact
        # артефакт нужен только для публикации
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out/html'

  deploy:
    name: Публикация
    needs: build
    # из pull request только собираем, но не публикуем
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
